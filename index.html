<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- title -->
    <title>cronometer</title>

    <!-- styles -->
    <link rel="stylesheet" href="/cronometer-logger/assets/css/styles.css" />
  </head>

  <body>
    <!-- main -->
    <main class="main">
      <section class="main__cronometer">
        <!-- status -->
        <div class="cronometer__status">
          <div class="status__datetime">
            <span class="status__date" id="date"></span>
            <span class="status__time" id="time"></span>
          </div>
          <div class="status__durations">
            <div class="status__total">total: <span class="total__time" id="total"></span></div>
            <div class="status__today">today: <span class="today__time" id="today"></span></div>
            <div class="status__current">current: <span class="current__time" id="current"></span></div>
          </div>
        </div>
        <!-- history -->
        <ul class="cronometer__history" id="history"></ul>
      </section>
    </main>

    <!-- scripts -->
    <script type="module" src="/cronometer-logger/assets/js/script.js"></script>
  </body>
</html>
